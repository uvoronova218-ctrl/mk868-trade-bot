name: Telegram notifier v2 tests
on:
  push:
    branches:
      - feature/money-engine-telegram-v2
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile main.py tests/test_webhook.py
      - name: Offline unit tests
        run: python -m pytest -q
